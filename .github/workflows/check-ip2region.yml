name: Check ip2region Update

on:
  schedule:
    # 每月1号。16号凌晨2点检查一次 (UTC时间，北京时间为上午10点)
    # 北京时间凌晨2点，使用 '0 18 * * *' (UTC 18:00 = 北京时间 02:00)
    - cron: "0 18 1,16 * *"
  workflow_dispatch: # 允许手动触发

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest commit hash of ip2region_v4.xdb
        id: check
        run: |
          # 获取目标文件最新的 commit hash
          LATEST_HASH=$(curl -s "https://api.github.com/repos/lionsoul2014/ip2region/commits?path=data/ip2region_v4.xdb&per_page=1" | jq -r '.[0].sha')
          echo "latest_hash=$LATEST_HASH" >> $GITHUB_OUTPUT

          # 读取上次记录的 hash
          if [ -f .github/ip2region_hash.txt ]; then
            STORED_HASH=$(cat .github/ip2region_hash.txt)
          else
            STORED_HASH=""
          fi
          echo "stored_hash=$STORED_HASH" >> $GITHUB_OUTPUT

          # 判断是否有更新
          if [ "$LATEST_HASH" != "$STORED_HASH" ] && [ -n "$LATEST_HASH" ] && [ "$LATEST_HASH" != "null" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Download new ip2region_v4.xdb
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -L -o ip2region_v4.xdb "https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb"
          echo "${{ steps.check.outputs.latest_hash }}" > .github/ip2region_hash.txt

      - name: Get version info
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          FULL_VERSION=$(grep -oP 'version:\s*"\K[^"]+' server/config.yaml | head -1)
          echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Full version: $FULL_VERSION"

      - name: Check if release exists
        if: steps.check.outputs.changed == 'true'
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${{ steps.version.outputs.full }}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            # 获取现有的 dist 和 server 包版本
            DIST_ASSET=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | grep '^dist-' | head -1 || echo "")
            SERVER_ASSET=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | grep '^server-' | head -1 || echo "")
            echo "dist_asset=$DIST_ASSET" >> $GITHUB_OUTPUT
            echo "server_asset=$SERVER_ASSET" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "dist_asset=" >> $GITHUB_OUTPUT
            echo "server_asset=" >> $GITHUB_OUTPUT
          fi
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Delete old ip2region asset if exists
        if: steps.check.outputs.changed == 'true' && steps.check_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ steps.check_release.outputs.tag }} --json assets -q '.assets[].name' | grep '^ip2region_v4' | while read asset; do
            echo "Deleting old asset: $asset"
            gh release delete-asset ${{ steps.check_release.outputs.tag }} "$asset" -y || true
          done

      - name: Create or Update Release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_TAG="${{ steps.check_release.outputs.tag }}"
          IP2REGION_FILE="ip2region_v4.xdb"
          DIST_FILE="${{ steps.check_release.outputs.dist_asset }}"
          SERVER_FILE="${{ steps.check_release.outputs.server_asset }}"

          # 构建下载链接
          IP2REGION_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${IP2REGION_FILE}"
          IP2REGION_ROW="| IP数据库 | [${IP2REGION_FILE}](${IP2REGION_LINK}) | ip2region 离线IP地址定位库 |"

          if [ -n "$DIST_FILE" ]; then
            DIST_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${DIST_FILE}"
            DIST_ROW="| 前端 | [${DIST_FILE}](${DIST_LINK}) | Vue 3 + Element Plus 构建产物 |"
          else
            DIST_ROW="| 前端 | 暂无 | 等待前端发布 |"
          fi

          if [ -n "$SERVER_FILE" ]; then
            SERVER_LINK="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${SERVER_FILE}"
            SERVER_ROW="| 后端 | [${SERVER_FILE}](${SERVER_LINK}) | FastAPI + Tortoise-ORM 服务端 |"
          else
            SERVER_ROW="| 后端 | 暂无 | 等待后端发布 |"
          fi

          RELEASE_BODY=$(cat .github/RELEASE_TEMPLATE.md)
          RELEASE_BODY="${RELEASE_BODY//\{\{RELEASE_TAG\}\}/$RELEASE_TAG}"
          RELEASE_BODY="${RELEASE_BODY//\{\{DIST_ROW\}\}/$DIST_ROW}"
          RELEASE_BODY="${RELEASE_BODY//\{\{SERVER_ROW\}\}/$SERVER_ROW}"
          RELEASE_BODY="${RELEASE_BODY//\{\{IP2REGION_ROW\}\}/$IP2REGION_ROW}"

          if [ "${{ steps.check_release.outputs.exists }}" == "true" ]; then
            gh release upload "$RELEASE_TAG" "$IP2REGION_FILE" --clobber
            gh release edit "$RELEASE_TAG" --notes "$RELEASE_BODY"
            echo "Updated release $RELEASE_TAG with ip2region"
          else
            gh release create "$RELEASE_TAG" \
              --title "Release $RELEASE_TAG" \
              --notes "$RELEASE_BODY" \
              "$IP2REGION_FILE"
            echo "Created new release $RELEASE_TAG with ip2region"
          fi

      - name: Update hash record
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ip2region_hash.txt
          git commit -m "chore: update ip2region hash record"
          git push
